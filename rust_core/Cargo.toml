[package]
name = "rust_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "rust_core"

[dependencies]
uniffi = { version = "0.32.1", features = [ "cli" , "tokio" ] }
sqlx = { version = "0.8", default-features = false, features = [ "runtime-tokio", "tls-rustls-ring", "postgres", "macros" ] }
thiserror = "2"

[build-dependencies]
uniffi = { version = "0.32.1", features = [ "build" ] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
